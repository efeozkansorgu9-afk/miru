<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="fonradar-logo-title">
  <title id="fonradar-logo-title">FonRadar</title>

  <!--
    Two funds, and the part of them that is the same thing.

    The mark is the product's own finding: two holdings drawn as outlines,
    and the ground they share filled in. A basket where the lens is most of
    the circles bought one fund twice. Both halves have to be legible or the
    idea is not there: a mark where only the lens survives is an almond.

    Geometry is arithmetic, not eyeballing. Circles of r=9.5 at (12.5,16) and
    (19.5,16) are 7 apart, so they cross at x=16, y=16 +/- sqrt(90.25 -
    12.25), which is 7.17 and 24.83. That makes a lens 12 wide and 17.66
    tall, inside a mark spanning x 3..29 and y 6.5..25.5. Both arcs of the
    lens sweep the same way and neither passes 180 degrees, hence flags 0 1
    on each.

    7 apart rather than 9 is what widens the lens, from 9 wide to 12. It is
    not closer than that because the crescent left outside the lens is
    exactly as wide as the gap between the centres: at 7 each crescent is
    still 7 units, 3.5 pixels at favicon size, and reads as its own circle.
    Closing the gap further buys lens width by dissolving the two rings into
    one blob, which is the whole idea gone.

    The stroke is 1.5, chosen by rendering 1.25 through 2 from 16 to 128
    pixels at 1x as well as 2x. At 16px one unit is half a device pixel, so
    this is a hair under one: it softens but still closes each ring, and 2
    reads as a heavy band at display sizes.

    The fill is painted first and the outlines over it, so the stroke sits
    centred on the lens edge and each circle reads as one unbroken ring.
  -->

  <style>
    /*
      The palette, as variables, so a colour is named once here rather than
      twice below.

      Hex rather than the oklch the app's tokens are written in, and local
      rather than referenced, because this file is its own document: as a
      favicon or behind an `img` tag it cannot see the page's custom
      properties, and `var(--accent)` would resolve to nothing.

      The outline does NOT follow the colour scheme, and that is the fix for
      the version that came before it. Near black on light and near white on
      dark looks strongest when the two agree, and disappears completely when
      they do not: measured, slate-950 scores 1.03 against a dark ground and
      slate-50 scores 1.07 against a light one, and a favicon has no say in
      the ground it is dropped onto. A tab strip, a bookmark bar and a
      browser in a scheme the reader did not choose are all backgrounds this
      file cannot see.

      So one mid tone that clears the 3:1 non-text minimum against both ends
      of the range: 4.90 on white, 3.93 on the app's night. It gives up the
      19:1 of a matched near black and can never vanish, which for two rings
      that carry the meaning is the right way round.

      The lens keeps the scheme switch. It is a large filled shape rather
      than a hairline, so it reads either way, and the brand colour is worth
      matching to the surroundings where that is possible.
    */
    svg {
      --logo-line: #70707a;
      --logo-mark: #6c3ef9;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --logo-mark: #9a90ff;
      }
    }
  </style>

  <path d="M16 7.17A9.5 9.5 0 0 1 16 24.83A9.5 9.5 0 0 1 16 7.17Z" fill="var(--logo-mark)" />

  <g fill="none" stroke="var(--logo-line)" stroke-width="1.5">
    <circle cx="12.5" cy="16" r="9.5" />
    <circle cx="19.5" cy="16" r="9.5" />
  </g>
</svg>
